; Upload limits for the admin application on hosts that read per-directory .user.ini files
; (cPanel with PHP-FPM/CGI). On Apache with mod_php, or if this file is ignored, set the same
; values in the hosting control panel (MultiPHP INI Editor) or php.ini.
;
; Vehicle images (Spec 07): the application itself allows 10 MB per image and 10 images per
; upload. max_file_uploads is deliberately higher than 10 so the application, not PHP, refuses
; an 11th file with a clear message.
upload_max_filesize = 10M
post_max_size = 64M
max_file_uploads = 20
